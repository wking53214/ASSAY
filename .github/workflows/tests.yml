name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,cns]"
      # ASSAY itself is standard library only. Four specimens import numpy or
      # matplotlib, and the claims that run them are skipped without them, so
      # they are installed here for the runner only (not as a dependency), at the
      # versions in ci-constraints.txt so the claim count cannot drift with a release.
      - run: pip install -c ci-constraints.txt numpy matplotlib
      # Static gates first: they take seconds. The specimens are deliberately
      # damaged files and are excluded in pyproject.toml.
      - run: ruff check .
      - run: mypy
      # Prove the answer key (about 5 seconds). A claim that could not be run
      # on this runner is a failure by default; --strict says so explicitly.
      - run: python verify_manifest.py --strict
      - run: pytest -q

  # The consumers of registry.json load the key with their own code. Each is
  # checked out at a pinned full commit SHA so this job fails because of a
  # change here, not because a sibling moved. The pins are the last set this
  # repository's CI tested on its own. They are not the current heads of those
  # repositories, and nothing here claims they are. Whether the set that lands
  # together works together is checked by the `stack` job in the CNS
  # repository, not by this one. To bump a pin: take the new full commit SHA
  # of that repository, change the ref below, update the comment (version from
  # that commit's own version file), and re-run this job.
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/SWIZZLE
          ref: 522658415b026ac3211d3fc130ba7da7c77cc400  # SWIZZLE 0.8.5 per its pyproject; the last commit this job tested, not SWIZZLE's head
          path: siblings/SWIZZLE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/WARDEN
          ref: 380894f0304ef40587dd29efd41b4ceccf94a5d3  # WARDEN 0.13.8 per warden.__version__; the last commit this job tested, not WARDEN's head
          path: siblings/WARDEN
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -c ci-constraints.txt -e ".[dev,cns]" numpy matplotlib
      # -rs lists skips; the check after it makes a skip a failure, because a
      # skipped consumer test proves nothing about the consumer.
      - run: |
          set -o pipefail
          SWIZZLE_ROOT="$PWD/siblings/SWIZZLE" WARDEN_ROOT="$PWD/siblings/WARDEN" \
            pytest tests/test_consumers.py -q -rs -p no:cacheprovider | tee consumers.log
          ! grep -q "skipped" consumers.log

  # The committed Ghost baseline lists the findings this repository has agreed to stop seeing. It went stale once and
  # nothing said so until the circuit rejected the repository, so this job installs ghost_tools at a pinned full commit
  # and compares the baseline with a fresh scan. Like `consumers`, a skipped test is a failure. To bump the pin: take
  # the new full commit SHA of ghost_tools, change it here and in tests/test_ghost_baseline.py, and rebuild the
  # baseline if the test says it is out of date.
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "ghost-tools @ git+https://github.com/wking53214/ghost_tools.git@5a9154d3c76670f5bf1f46d845acadfed46d7bc8"  # ghost_tools 1.10.8
      - env:
          ASSAY_REQUIRE_GHOST_BASELINE: "1"
        run: |
          set -o pipefail
          pytest tests/test_ghost_baseline.py -q -rs -p no:cacheprovider | tee baseline.log
          ! grep -q "skipped" baseline.log

  # What a user gets from `pip install`: the wheel must carry the commands and
  # registry.json, and the installed command must prove a checkout.
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -c ci-constraints.txt build numpy matplotlib
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -c "$GITHUB_WORKSPACE/ci-constraints.txt" "$RUNNER_TEMP"/dist/assay-*.whl numpy matplotlib
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/assay-verify" --version
          "$RUNNER_TEMP/venv/bin/assay-manifest" --version
          # the version has two sources in an install, the package attribute and the distribution metadata
          "$RUNNER_TEMP/venv/bin/python" -c "import assay_production, importlib.metadata as m; assert m.version('assay') == assay_production.__version__, (m.version('assay'), assay_production.__version__); print(assay_production.__version__)"
          "$RUNNER_TEMP/venv/bin/assay-verify" --root "$GITHUB_WORKSPACE" --strict
          # a typo must be an error, not a weaker run
          ! "$RUNNER_TEMP/venv/bin/assay-verify" --root "$GITHUB_WORKSPACE" --stirct
