name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,cns]"
      # ASSAY itself is standard library only. Four specimens import numpy or
      # matplotlib, and the claims that run them are skipped without them, so
      # they are installed here for the runner only (not as a dependency).
      - run: pip install numpy matplotlib
      # Static gates first: they take seconds. The specimens are deliberately
      # damaged files and are excluded in pyproject.toml.
      - run: ruff check .
      - run: mypy
      # Prove the answer key (about 5 seconds). A claim that could not be run
      # on this runner is a failure by default; --strict says so explicitly.
      - run: python verify_manifest.py --strict
      - run: pytest -q

  # The consumers of registry.json load the key with their own code. Each is
  # checked out at a pinned full commit SHA so this job fails because of a
  # change here, not because a sibling moved. The pins are the tested set:
  # the commits this release was checked against, which may be one or more
  # commits behind each repository's branch head. To bump a pin: take the new
  # full commit SHA of that repository, change the ref below, update the
  # comment (version from that commit's own version file), and re-run this job.
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/SWIZZLE
          ref: 04b72b197b703e7e64be62039509c1c9e6c3bf20  # tested set: SWIZZLE 0.8.0 per its pyproject, 20 commits after its older v0.10.0 tag
          path: siblings/SWIZZLE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/WARDEN
          ref: ec551d8e10f82b6e3e681593a97011ae517d360b  # tested set: WARDEN 0.13.1 per warden.__version__, 8 commits after tag v0.11.4
          path: siblings/WARDEN
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,cns]" numpy matplotlib
      # -rs lists skips; the check after it makes a skip a failure, because a
      # skipped consumer test proves nothing about the consumer.
      - run: |
          set -o pipefail
          SWIZZLE_ROOT="$PWD/siblings/SWIZZLE" WARDEN_ROOT="$PWD/siblings/WARDEN" \
            pytest tests/test_consumers.py -q -rs -p no:cacheprovider | tee consumers.log
          ! grep -q "skipped" consumers.log

  # What a user gets from `pip install`: the wheel must carry the commands and
  # registry.json, and the installed command must prove a checkout.
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install build numpy matplotlib
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/assay-*.whl numpy matplotlib
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/assay-verify" --version
          "$RUNNER_TEMP/venv/bin/assay-manifest" --version
          "$RUNNER_TEMP/venv/bin/assay-verify" --root "$GITHUB_WORKSPACE" --strict
          # a typo must be an error, not a weaker run
          ! "$RUNNER_TEMP/venv/bin/assay-verify" --root "$GITHUB_WORKSPACE" --stirct
